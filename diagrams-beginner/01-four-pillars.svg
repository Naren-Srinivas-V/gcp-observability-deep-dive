<svg width="1000" height="400" viewBox="0 0 1000 400" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="400" fill="#FFFBEB"/>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">Four simple questions about your app</text>

  <rect x="30" y="110" width="220" height="150" rx="20" fill="#0EA5E9"/>
  <text x="140" y="150" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Logging</text>
  <text x="140" y="175" font-size="11" fill="#E0F2FE" text-anchor="middle">"What exactly</text>
  <text x="140" y="192" font-size="11" fill="#E0F2FE" text-anchor="middle">happened?"</text>
  <text x="140" y="225" font-size="10" fill="#BAE6FD" text-anchor="middle">where our story began</text>

  <rect x="270" y="110" width="220" height="150" rx="20" fill="#10B981"/>
  <text x="380" y="150" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Monitoring</text>
  <text x="380" y="175" font-size="11" fill="#D1FAE5" text-anchor="middle">"Is everything OK</text>
  <text x="380" y="192" font-size="11" fill="#D1FAE5" text-anchor="middle">right now?"</text>

  <rect x="510" y="110" width="220" height="150" rx="20" fill="#FB7185"/>
  <text x="620" y="150" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Tracing</text>
  <text x="620" y="175" font-size="11" fill="#FFE4E6" text-anchor="middle">"Where exactly did</text>
  <text x="620" y="192" font-size="11" fill="#FFE4E6" text-anchor="middle">the time go?"</text>

  <rect x="750" y="110" width="220" height="150" rx="20" fill="#F59E0B"/>
  <text x="860" y="150" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Error Reporting</text>
  <text x="860" y="175" font-size="11" fill="#FEF3C7" text-anchor="middle">"Which mistakes keep</text>
  <text x="860" y="192" font-size="11" fill="#FEF3C7" text-anchor="middle">happening?"</text>

  <text x="500" y="330" font-size="14" fill="#78716C" text-anchor="middle" font-style="italic">
    You don't need to be an expert to understand these — they're just four everyday
  </text>
  <text x="500" y="352" font-size="14" fill="#78716C" text-anchor="middle" font-style="italic">
    questions, asked about a computer program instead of about your car or your health.
  </text>
</svg>
