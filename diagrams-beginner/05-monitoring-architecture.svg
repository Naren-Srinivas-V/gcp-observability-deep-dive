<svg width="1000" height="440" viewBox="0 0 1000 440" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="440" fill="#FFFBEB"/>
  <defs>
    <marker id="b5" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M1 1L9 5L1 9" fill="none" stroke="#A8A29E" stroke-width="1.5"/>
    </marker>
  </defs>
  <text x="500" y="40" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">Cloud Monitoring is one big control room</text>

  <!-- sources: everything you built -->
  <rect x="30" y="90" width="160" height="55" rx="14" fill="#0EA5E9"/>
  <text x="110" y="123" font-size="11" fill="#FFF" text-anchor="middle" font-weight="bold">Your Cloud Run app</text>

  <rect x="30" y="160" width="160" height="55" rx="14" fill="#10B981"/>
  <text x="110" y="193" font-size="11" fill="#FFF" text-anchor="middle" font-weight="bold">Your database</text>

  <rect x="30" y="230" width="160" height="55" rx="14" fill="#FB7185"/>
  <text x="110" y="263" font-size="11" fill="#FFF" text-anchor="middle" font-weight="bold">Your network rules</text>

  <rect x="30" y="300" width="160" height="55" rx="14" fill="#F59E0B"/>
  <text x="110" y="333" font-size="11" fill="#FFF" text-anchor="middle" font-weight="bold">Your data pipeline</text>

  <!-- center -->
  <rect x="345" y="150" width="230" height="130" rx="20" fill="#1F2937"/>
  <text x="460" y="205" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Cloud</text>
  <text x="460" y="228" font-size="15" fill="#FFFFFF" text-anchor="middle" font-weight="bold">Monitoring</text>

  <g stroke="#A8A29E" stroke-width="1.5" fill="none">
    <line x1="190" y1="117" x2="340" y2="185" marker-end="url(#b5)"/>
    <line x1="190" y1="187" x2="340" y2="205" marker-end="url(#b5)"/>
    <line x1="190" y1="257" x2="340" y2="230" marker-end="url(#b5)"/>
    <line x1="190" y1="327" x2="340" y2="250" marker-end="url(#b5)"/>
  </g>

  <!-- outputs -->
  <rect x="650" y="90" width="320" height="55" rx="14" fill="#D1FAE5"/>
  <text x="810" y="123" font-size="12" fill="#065F46" text-anchor="middle" font-weight="bold">A screen you glance at (dashboard)</text>

  <rect x="650" y="165" width="320" height="55" rx="14" fill="#FFE4E6"/>
  <text x="810" y="198" font-size="12" fill="#BE123C" text-anchor="middle" font-weight="bold">A message that pings you (alert)</text>

  <rect x="650" y="240" width="320" height="55" rx="14" fill="#E0F2FE"/>
  <text x="810" y="273" font-size="12" fill="#075985" text-anchor="middle" font-weight="bold">A simple "is it up?" check</text>

  <g stroke="#A8A29E" stroke-width="1.5" fill="none">
    <line x1="575" y1="190" x2="645" y2="117" marker-end="url(#b5)"/>
    <line x1="575" y1="210" x2="645" y2="192" marker-end="url(#b5)"/>
    <line x1="575" y1="230" x2="645" y2="267" marker-end="url(#b5)"/>
  </g>

  <text x="500" y="410" font-size="14" fill="#78716C" text-anchor="middle" font-style="italic">
    Everything you've built in this series reports into one room — so you never have to check each thing separately.
  </text>
</svg>
