<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="420" fill="#FFFBEB"/>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">Your error budget is like a piggy bank of allowed mistakes</text>

  <rect x="80" y="90" width="840" height="60" rx="16" fill="#D1FAE5"/>
  <text x="500" y="126" font-size="14" fill="#065F46" text-anchor="middle" font-weight="bold">The goal: 99.9% of requests succeed, every 30 days</text>

  <rect x="80" y="190" width="798" height="46" rx="10" fill="#10B981"/>
  <text x="480" y="219" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold">successes — this is the money you didn't spend</text>
  <rect x="878" y="190" width="42" height="46" rx="10" fill="#FB7185"/>

  <text x="920" y="175" font-size="11" fill="#BE123C" text-anchor="middle" font-weight="bold">spendable</text>
  <text x="920" y="265" font-size="11" fill="#BE123C" text-anchor="middle" font-weight="bold">on failures</text>

  <rect x="80" y="300" width="840" height="90" rx="14" fill="#FFFFFF" stroke="#F59E0B" stroke-width="2"/>
  <text x="110" y="330" font-size="12.5" fill="#1F2937" font-weight="bold">You're allowed to "spend" that little sliver:</text>
  <text x="110" y="355" font-size="12" fill="#57534E">try a risky new feature, a bold experiment — as long as you don't spend more failures than you've saved up.</text>
  <text x="110" y="375" font-size="12" fill="#57534E">Once it's gone, it's time to slow down and be extra careful until next month's budget resets.</text>
</svg>
