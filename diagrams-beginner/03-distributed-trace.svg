<svg width="1000" height="420" viewBox="0 0 1000 420" xmlns="http://www.w3.org/2000/svg" font-family="Calibri, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <rect width="1000" height="420" fill="#FFFBEB"/>
  <text x="500" y="42" font-size="20" font-weight="bold" fill="#1F2937" text-anchor="middle">Tracing is like a relay race, timed leg by leg</text>

  <text x="70" y="110" font-size="13" fill="#1F2937" font-weight="bold">Runner 1: Frontend</text>
  <rect x="70" y="120" width="500" height="32" rx="16" fill="#0EA5E9"/>
  <text x="320" y="141" font-size="11" fill="#FFF" text-anchor="middle">whole race: 420ms</text>

  <text x="70" y="185" font-size="13" fill="#1F2937" font-weight="bold">Runner 2: Auth check</text>
  <rect x="95" y="195" width="80" height="30" rx="15" fill="#10B981"/>
  <text x="135" y="215" font-size="10" fill="#FFF" text-anchor="middle">40ms</text>

  <text x="70" y="260" font-size="13" fill="#1F2937" font-weight="bold">Runner 3: Order service</text>
  <rect x="185" y="270" width="220" height="30" rx="15" fill="#FB7185"/>
  <text x="295" y="290" font-size="10" fill="#FFF" text-anchor="middle">280ms — this leg was slow!</text>

  <text x="70" y="335" font-size="13" fill="#1F2937" font-weight="bold">Runner 4: Database</text>
  <rect x="215" y="345" width="180" height="30" rx="15" fill="#F59E0B"/>
  <text x="305" y="365" font-size="10" fill="#FFF" text-anchor="middle">210ms of that was here</text>

  <text x="500" y="405" font-size="14" fill="#78716C" text-anchor="middle" font-style="italic">
    Just like a coach can tell which runner lost time for the team, a trace tells you which "runner" (service) was slow.
  </text>
</svg>
